<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Negozio didattico</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.prod.js"></script>
    <script type="module" src="./js/app.js"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800 antialiased">
    <a href="#contenuto" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:rounded-md focus:bg-white focus:px-4 focus:py-2 focus:shadow-lg">Vai al contenuto</a>

    <div id="app" class="flex min-h-screen flex-col">
        <header class="bg-slate-900 text-white shadow">
            <nav aria-label="Navigazione principale" class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-4">
                <router-link to="/" class="text-xl font-bold">Negozio didattico</router-link>
                <ul class="flex gap-2">
                    <li><router-link to="/" exact-active-class="bg-blue-600" class="block rounded-md px-3 py-2 hover:bg-slate-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white">Home</router-link></li>
                    <li><router-link to="/prodotti" active-class="bg-blue-600" class="block rounded-md px-3 py-2 hover:bg-slate-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white">Prodotti</router-link></li>
                </ul>
            </nav>
        </header>

        <main id="contenuto" tabindex="-1" class="mx-auto w-full max-w-6xl flex-1 px-4 py-8">
            <router-view></router-view>
        </main>

        <footer class="bg-slate-900 px-4 py-5 text-center text-sm text-white">
            <p>Progetto di Tecnologie Web</p>
        </footer>
    </div>
</body>
</html>
